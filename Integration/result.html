
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Result - Scene Solver</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles_result.css') }}">
</head>
<body>

  <!-- Background video -->
  <video autoplay muted loop id="bgVideo">
    <source src="{{ url_for('static', filename='videos/background1.mp4') }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Overlay for centering and darkening -->
  <div class="overlay">
    <div class="result-container">
      <h1>Analysis Result</h1>

      <h2>Predicted Crime Class:</h2>
      <p>{{ predicted_class }}</p>

      {% if summary %}
        <h2>Generated Summary:</h2>
        <p>{{ summary }}</p>
      {% else %}
        <p>No suspicious activity detected. (Non-Crime)</p>
      {% endif %}

      <a href="{{ url_for('home') }}">Analyze another video</a>
    </div>
  </div>

</body>
</html>
