<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles_signup.css') }}">
  <script>
    function validateForm() {
      var pass = document.getElementById("password").value;
      var confirmPass = document.getElementById("confirm_password").value;

      if (pass !== confirmPass) {
        document.getElementById("error").innerText = "Passwords do not match!";
        return false;
      }

      return true;
    }
  </script>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop id="bgVideo">
    <source src="{{ url_for('static', filename='videos/background1.mp4') }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Centered overlay with signup form -->
  <div class="overlay">
    <div class="signup-container">
      <h2>Sign Up</h2>
      <form class="signup-form" method="POST" onsubmit="return validateForm()">
        <input type="text" id="username" name="username" placeholder="Enter your Username or ID" required><br>
        <input type="password" id="password" name="password" required placeholder="Password"><br>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm Password"><br>
        <input type="submit" value="Signup">
      </form>

      <p id="error" style="color:red; text-align: center;"></p>

      {% if error %}
        <p style="color:red; text-align: center;">{{ error }}</p>
      {% endif %}

      <p style="text-align: center;">
        <a href="{{ url_for('login') }}" class="login-link">Already have an account? Login</a>
      </p>
    </div>
  </div>

</body>
</html>
